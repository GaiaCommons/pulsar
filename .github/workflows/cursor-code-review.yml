# Post an AI code review comment on every pull request.
# Requires: CURSOR_API_KEY in repo Secrets (Settings → Secrets and variables → Actions).
# Optional: set CURSOR_REVIEW_MODEL in repo Variables to override the model (e.g. gpt-4o).

name: Cursor code review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD --no-color > pr-diff.txt
          echo "diff_lines=$(wc -l < pr-diff.txt)" >> $GITHUB_OUTPUT

      - name: Install Cursor CLI
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Run Cursor review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          "$HOME/.cursor/bin/agent" -p --output-format text \
            "Review the pull request diff in pr-diff.txt. Focus on: code quality, potential bugs, security, and best practices. \
            Write a concise review (bullet points, under 2000 chars) to cursor-review.txt. \
            Do not modify any project files; only create cursor-review.txt with your review." \
            --model ${{ vars.CURSOR_REVIEW_MODEL || 'gpt-4o-mini' }} 2>/dev/null || true
          if [ ! -f cursor-review.txt ]; then echo "Cursor review could not be generated." > cursor-review.txt; fi

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('cursor-review.txt')
              ? '## Cursor code review\n\n' + fs.readFileSync('cursor-review.txt', 'utf8')
              : '## Cursor code review\n\nReview could not be generated. Check CURSOR_API_KEY and workflow logs.';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.body && c.body.includes('## Cursor code review'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
