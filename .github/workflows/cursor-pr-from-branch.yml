# When you push a branch that looks like it was created for an issue (e.g. cursor-42 or fix/42),
# open a PR targeting main and set the description to "Fixes #42" so the issue is linked.
# Cursor's cloud agent can create branches from issues; this workflow turns those branches into PRs.

name: Open PR from Cursor/issue branch

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch
        run: |
          echo "ref=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Extract issue number from branch name
        id: issue
        run: |
          REF="${{ steps.branch.outputs.ref }}"
          # Match patterns like: cursor-123, fix-123, fix/123, issue-123, issue/123
          if [[ "$REF" =~ (cursor|fix|issue)[-/]([0-9]+) ]]; then
            echo "number=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
          elif [[ "$REF" =~ ^([0-9]+)- ]]; then
            echo "number=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          fi

      - name: Check for existing PR
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            const ref = '${{ steps.branch.outputs.ref }}';
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${ref}`,
            });
            core.setOutput('exists', prs.length > 0 ? 'true' : 'false');
            if (prs.length > 0) core.setOutput('number', prs[0].number);

      - name: Create pull request
        if: steps.existing.outputs.exists != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = '${{ steps.branch.outputs.ref }}';
            const issueNum = '${{ steps.issue.outputs.number }}';
            const body = issueNum
              ? `Fixes #${issueNum}\n\nAuto-opened from branch \`${ref}\`.`
              : `Auto-opened from branch \`${ref}\`.`;
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `PR: ${ref}`,
              head: ref,
              base: 'main',
              body,
            });
            core.setOutput('number', pr.number);
